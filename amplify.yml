version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm pkg set scripts.prepare="echo *" && npm install --force
    build:
      commands:
        - env | grep -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e NEXTAUTH_SECRET -e BACKEND_URL -e NEXT_PUBLIC_API_URL -e NEXT_PUBLIC_BACKEND_URL -e SERVER_SECRET -e NEXTAUTH_URL >> .env
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*