name: Mirror to Backup Remote

on:
  push:
    branches:
      - dev

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important: fetch full history for mirroring

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add mirror remote
        env:
          GH_PAT: ${{ secrets.KAINY_PAT }}
        run: |
          git remote add mirror "https://Kainy2:$GH_PAT@github.com/Kainy2/umojalinn-FE.git"

      - name: Debug environment and remote
        env:
          GH_PAT: ${{ secrets.KAINY_PAT }}
        run: |
          echo "Token length: ${#GH_PAT}"
          git remote -v
          git config --get user.name
          git config --get user.email

      - name: Push to mirror
        env:
          GH_PAT: ${{ secrets.KAINY_PAT }}
        run: |
          git push mirror HEAD:dev --force
