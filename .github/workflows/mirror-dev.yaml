name: Mirror to Backup Remote

on:
  push:
    branches:
      - dev

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important: fetch full history for mirroring

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Push to mirror remote
        env:
          PAT: ${{ secrets.KAINY_PAT }}
        run: |
          git remote add mirror "https://Kainy2:$PAT@github.com/Kainy2/umojalinn-FE.git"                                            
          git push mirror dev
